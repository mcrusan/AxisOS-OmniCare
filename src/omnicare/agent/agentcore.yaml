# ==============================================================================
# File: src/omnicare/agent/agentcore.yaml
# Project: AxisOS OmniCare (Crusan & Co.)
# Author: Marc F. Crusan / Crusan & Co. w/ AGY
# Date: 2026-10-20
# Description: Amazon Bedrock AgentCore multi-agent configuration and tool
#              action groups for AxisOS OmniCare.
# Changelog:
#   - 2026-10-20 (MFC/AGY): Defined 5 Bedrock agents and 7 action group tools.
# ==============================================================================

vendor: "Crusan & Co."
project: "AxisOS OmniCare"
version: "1.0.0"
pillars:
  - HONEST
  - AUDITABLE
  - OWNED

bedrock:
  region: "us-west-2"
  model_id: "anthropic.claude-3-sonnet-20240229-v1:0"
  max_tokens: 1024
  temperature: 0.1

agents:
  CareAgent:
    description: "General omnichannel triage, care continuity, appointment scheduling, and medication refills."
    tools:
      - SendSMS
      - SendWhatsAppTemplate
      - ScheduleFollowup
      - LookupUserProfile

  AxisAgent:
    description: "Cloud-to-edge Sovereign Triad coordinator interfacing with Zero-Core (:8081), Lite (:8080), Axis-Agent (:8082), and Comms (:8085)."
    tools:
      - GetAxisOSTelemetry
      - TriggerAxisOSAction
      - SendSMS
      - SendWhatsAppTemplate

  SummaryAgent:
    description: "Intent-based channel switcher that escalates SMS/WhatsApp conversations into full Amazon SES diagnostic reports."
    tools:
      - SwitchChannel
      - SendEmail
      - GetAxisOSTelemetry

  SupportAgent:
    description: "Edge hardware and 3-NIC / RAID5 troubleshooting workflow agent."
    tools:
      - GetAxisOSTelemetry
      - TriggerAxisOSAction
      - SwitchChannel

  SetupAgent:
    description: "Node onboarding, mutual safeword verification, and preferred channel registration."
    tools:
      - LookupUserProfile
      - SendWhatsAppTemplate
      - SendSMS

tools:
  - name: SendSMS
    channel: sms
    provider: aws-cds-sns
  - name: SendWhatsAppTemplate
    channel: whatsapp
    provider: aws-cds-socialmessaging
  - name: SendEmail
    channel: email
    provider: amazon-ses
  - name: LookupUserProfile
    provider: amazon-dynamodb
  - name: GetAxisOSTelemetry
    provider: axisos-sovereign-triad
  - name: TriggerAxisOSAction
    provider: axisos-sovereign-triad
  - name: ScheduleFollowup
    provider: amazon-dynamodb
  - name: SwitchChannel
    provider: omnicare-router
